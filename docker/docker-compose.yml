version: '3.8'

services:
  fitness-portal:
    build:
      context: ..
      dockerfile: Dockerfile
    image: fitness-portal:1.0.0
    container_name: fitness-portal-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEPLOY_ENV=production
    volumes:
      - portal-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portal-data:
    driver: local
